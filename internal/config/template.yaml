## uBixShepherd configuration.
##
## Written by the daemon on its first start. Every setting is commented out, so the
## built-in defaults apply and keep improving with new releases. Uncomment only what
## you want to change; the daemon reads this file when it starts.
## An unknown key is an error, so a typo cannot fall back to a default quietly.

## The daemon listens on loopback only. Port 0 picks a free port; clients find it in
## daemon.json next to this file.
# daemon:
#   listen: 127.0.0.1:0
#   ## How many agents (shepherd lane run) may run at once on this machine.
#   max_runs: 4
#   ## How often open lanes' merge requests are checked on the forge (off to stop).
#   poll: 60s
#   ## Dollars a day past which Shepherd holds the runs it starts on its own (pipeline
#   ## and gate fixes, routed requests); 0 for no cap. A warning comes at 80%.
#   budget: 20
#   ## What one Copilot credit costs, since Copilot reports credits, not dollars.
#   credit_usd: 0.04
#   ## What the daemon logs: debug, info, warn or error. A reload applies a change; the
#   ## SHEPHERD_LOG_LEVEL environment variable, when set, overrides it.
#   log_level: info

## The front desk (shepherd chat).
# desk:
#   ## Its model, unless the chat is started with --model or one was set with /model
#   ## in the chat; empty leaves it to Claude Code's default.
#   model: ""
#   ## When the daemon's front desk takes a turn on its own for the swarm's events:
#   ## attached (only while a client follows it, then one digest when one comes back),
#   ## always, or never.
#   wake: attached

## The profile every repo starts from.
# defaults:
#   base_branch: main
#   ## trunk: work lands on base_branch, releases are tags.
#   ## promotion: work lands on the first branch in `promotion` and moves up.
#   branch_model: trunk
#   ## Must pass in a lane's worktree before its work counts as green.
#   gate: make check
#   ## Globs more than one lane may want; a lane touching one takes a lease.
#   shared_paths: []
#   ## Where lane worktrees go; empty means <workspace>/<repo>-worktrees.
#   worktree_root: ""
#   ## Runs in each new lane's worktree ($SHEPHERD_REPO is the main checkout): what a
#   ## fresh worktree needs before its gate can run.
#   setup: cp "$SHEPHERD_REPO/.env" .env
#   ## A coordination file (AGENTS-COORD.md) to keep a generated view of the lanes in,
#   ## between markers, while sessions not on Shepherd still read it.
#   coord_file: ""
#   ## What comes before a release version in tags (v1.2.3); tag reserve hands these out.
#   tag_prefix: v
#   ## free, or reserved: every release tag pushed from the repo must be reserved first
#   ## (shepherd tag reserve) and contain its lane's merge. Needs the pre-push hook.
#   tags: free
#   ## Added to every agent's brief in the repo: its own rules.
#   brief: No Co-authored-by or AI tool trailers in commit messages.
#   ## Patterns commit messages must not match before Shepherd pushes; a match goes
#   ## back to the agent to amend.
#   forbid: ["(?i)co-authored-by"]
#   ## How the agents Shepherd starts run.
#   agent:
#     ## Claude Code permission mode: auto (your own auto mode and settings, as in your
#     ## interactive sessions), acceptEdits or default (only Shepherd's short list of
#     ## commands; anything else is refused headless), or bypassPermissions. Copilot
#     ## allows every tool for auto and bypassPermissions; Cursor always runs with --force.
#     permission_mode: auto
#     ## The model each agent runs on when lane run names none, by agent (claude,
#     ## copilot, cursor); an agent left out uses its CLI's own default. A repo's
#     ## entries replace these for the same agent. A model given to lane run wins.
#     model: {claude: sonnet}
#   ## What agents may do unasked: human or agent.
#   autonomy:
#     ## agent: an agent may arm merge-when-pipeline-succeeds on its own lane's merge
#     ## request (GitLab); approvals, pipelines and threads still gate it. Agents never
#     ## approve.
#     merge: human
#     tag: human
#     deploy: human
#     ## Who pushes a lane and opens its merge request: human; shepherd (after an
#     ## agent's run, once the gate passes in the lane; needs gate set; never merges);
#     ## or agent (the agent pushes its own lane's branch; needs no gate).
#     push: human
#     ## Propose a plan and wait before changing anything.
#     plan_first: true

## Per-repo profiles, keyed by the repo's path in its workspace as `shepherd init`
## lists it. Fields left out inherit from defaults.
# repos:
#   framework:
#     shared_paths: [README.md, .gitlab-ci.yml]
#     autonomy:
#       tag: agent
#   my-app:
#     base_branch: dev
#     branch_model: promotion
#     promotion: [dev, staging, main]
#     ## Repos this one depends on. When one releases (its tag's pipeline passed), Shepherd
#     ## opens a lane here and hands the agent the task. Lane and task may use {repo},
#     ## {tag}, {version}, {major}, {minor}, {patch} and {previous}.
#     follows:
#       - repo: framework
#         ## The smallest release worth a lane: patch, minor or major.
#         min_bump: minor
#         ## published (the tag's pipeline passed) or tagged (the tag alone).
#         after: published
#         lane: chore/{repo}-{major}.{minor}
#         scope: [composer.json, composer.lock]
#         agent: claude
#         task: |
#           Move the framework requirement in composer.json to ^{major}.{minor},
#           run composer update for it alone, run the gate, and commit.
