name: CI

# The canonical repo is on an internal GitLab that push-mirrors protected branches and
# tags here, so a push to any branch may be work under review: test it before it merges,
# not after. The same gate runs on GitLab (`make check`).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux and macOS are supported and required. Windows builds but is untested, so its
    # job is informational: it reports what breaks without failing the run.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Keep LF line endings on Windows, or gofmt reports every file.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Make
        if: runner.os == 'Windows'
        run: command -v make || choco install make --no-progress -y

      # The Fold tests drive the git CLI against real repos; never let them skip.
      - name: Tool versions
        run: go version && git --version

      - name: make check
        run: make check

  # The gitleaks binary, run directly: the gitleaks-action needs a licence for
  # organisations. Pinned to a release and checked against that release's published
  # SHA-256 before it runs. Findings are redacted in the log.
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the history, not only the tip

      - name: Install gitleaks
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan for secrets
        run: gitleaks detect --source . --config .github/gitleaks.toml --redact --no-banner --verbose
